<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="LuizDev.Py — programador, bots e automação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#14224a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ec5ff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3776ab"/><stop offset="1" stop-color="#ffd43b"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <radialGradient id="g1"><stop offset="0" stop-color="#3776ab" stop-opacity="0.55"/><stop offset="1" stop-color="#3776ab" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#ffd43b" stop-opacity="0.30"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="220" cy="80" r="260" fill="url(#g1)">
      <animate attributeName="cx" values="220;300;220" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="300" r="240" fill="url(#g2)">
      <animate attributeName="cy" values="300;240;300" dur="11s" repeatCount="indefinite"/>
    </circle>

    <text x="70" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2"><tspan fill="url(#ttl)">LuizDev</tspan><tspan fill="#ffd43b">.Py</tspan></text>
    <rect x="74" y="190" width="150" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="40;260;40" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" fill="#a9bde6">Programador BR · bots e automação</text>
    <text x="72" y="282" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="18" fill="#6f86b8">Python  ·  Telegram  ·  WhatsApp  ·  Pix</text>

    <g>
      <rect x="730" y="58" width="410" height="224" rx="14" fill="#080d1b" stroke="#2a3a6b" stroke-width="1.5"/>
      <rect x="730" y="58" width="410" height="34" rx="14" fill="#101a36"/>
      <rect x="730" y="78" width="410" height="14" fill="#101a36"/>
      <circle cx="754" cy="75" r="6" fill="#ff5f57"/><circle cx="776" cy="75" r="6" fill="#febc2e"/><circle cx="798" cy="75" r="6" fill="#28c840"/>
      <text x="935" y="80" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="13" fill="#6f86b8" text-anchor="middle">luizdev.py</text>
      <g font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="19">
        <text x="754" y="130"><tspan fill="#ffd43b">$</tspan><tspan fill="#e6edf7"> python run.py bot</tspan>
          <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.04;0.1;0.8;0.95;1" dur="9s" repeatCount="indefinite"/></text>
        <text x="754" y="170" fill="#7ee787">✓ <tspan fill="#c9d6f2">Pix confirmado</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.28;0.9;1" dur="9s" repeatCount="indefinite"/></text>
        <text x="754" y="206" fill="#7ee787">✓ <tspan fill="#c9d6f2">Saldo creditado</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.46;0.9;1" dur="9s" repeatCount="indefinite"/></text>
        <text x="754" y="242" fill="#7ee787">✓ <tspan fill="#c9d6f2">Pedido entregue</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.64;0.9;1" dur="9s" repeatCount="indefinite"/></text>
        <rect x="962" y="226" width="11" height="20" fill="#ffd43b">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
